version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: bigdata_postgres
    environment:
      POSTGRES_DB: bigdata_lab
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student123
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./mock_data:/mock_data
      - ./sql:/sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student -d bigdata_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: